name: Release
# Builds the deb for amd64 and the pkg for macOS arm64 of bcc, each on that platform, as the
# Python they ship and some wheels are the platform's, smoke-tests them, and attaches them to the GitHub release of a
# v* tag. Run by hand, it leaves them as the run's
# artifacts instead. The rpm packaging in pkg/ is kept but not built.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the installers, e.g. 2026.09.0"
        required: true

env:
  # the Python the packages ship; uv would otherwise take the newest it can download, whose
  # wheels may not exist yet
  UV_PYTHON: "3.13"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
      # the release's notes are the tag's CHANGELOG.md section; read here, a tag without one
      # fails before the builds rather than after
      - id: notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "notes<<END_OF_NOTES"
            awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { is_found = 1; next }
              is_found && /^## \[/ { exit }
              is_found { print }
              END { if (!is_found) exit 1 }' CHANGELOG.md
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # Ubuntu 24.04, the oldest Ubuntu the package supports
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: amd64
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: pkg/build.sh
      - run: pkg/package.sh deb
      - name: Install the package and load an instance with it
        # the runner's apt lists can be out of date for the deb's dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ./dist/*.deb
          sudo pkg/smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bcc-linux-amd64
          path: dist/*

  macos:
    needs: version
    runs-on: macos-14
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: pkg/build.sh
      - run: pkg/macos/build.sh
      - name: Install the package and load an instance with it
        run: |
          sudo installer -pkg dist/*.pkg -target /
          dscl . -read /Users/_bcc UniqueID
          sudo pkg/smoke-test.sh
          sudo /usr/local/share/*/uninstall.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bcc-macos-arm64
          path: dist/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          # a release candidate must not become the repository's latest release
          IS_PRERELEASE: ${{ contains(github.ref_name, '-rc') }}
          NOTES: ${{ needs.version.outputs.notes }}
        # given the files, gh uploads them to a draft and then publishes it, as a published
        # release is immutable and takes no more
        run: >-
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag
          --prerelease="$IS_PRERELEASE" --notes "$NOTES"
