name: Release
# Builds the installers of bcc (quantify) and bcc.simulator (qiskit), each on the platform it
# is for since Nuitka cannot cross-compile, smoke-tests them, and attaches them to the GitHub
# release of a v* tag. Run by hand, it leaves them as the run's artifacts instead.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the installers, e.g. 2026.09.0"
        required: true

env:
  # the Python the binaries are built and tested with; uv would otherwise take the newest it
  # can download, whose wheels may not exist yet
  UV_PYTHON: "3.12"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ${{ matrix.runner }}
    # qiskit, jax and scipy make a build of an hour or more
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          # PyQt5, which quantify needs, has no Linux aarch64 wheel
          - { runner: ubuntu-24.04, arch: amd64, binary: bcc, executor: quantify }
          - { runner: ubuntu-24.04, arch: amd64, binary: bcc.simulator, executor: qiskit }
          - { runner: ubuntu-24.04-arm, arch: arm64, binary: bcc.simulator, executor: qiskit }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - name: Build the binary
        run: |
          docker run --rm -e EXECUTOR=${{ matrix.executor }} -e UV_PYTHON -v "$PWD":/src -w /src \
            debian:bookworm pkg/build-linux.sh
      - name: Package it
        run: |
          pkg/package.sh ${{ matrix.binary }} deb
          pkg/package.sh ${{ matrix.binary }} rpm
      - name: Install each package and load an instance with it
        run: |
          for package in dist/*; do
            case $package in
              *.deb) image=debian:bookworm install="apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ./$package" ;;
              *.rpm) image=fedora:41 install="dnf install -y -q --setopt=install_weak_deps=False ./$package" ;;
            esac
            docker run --rm -v "$PWD":/src -w /src "$image" \
              sh -c "$install && pkg/smoke-test.sh ${{ matrix.binary }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-linux-${{ matrix.arch }}
          path: dist/*

  macos:
    needs: version
    runs-on: macos-14
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - { binary: bcc, executor: quantify }
          - { binary: bcc.simulator, executor: qiskit }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      EXECUTOR: ${{ matrix.executor }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      # Nuitka's own download of ccache is Intel-only, and its clang then fails under Rosetta
      - run: brew install ccache
      - name: Build the binary
        run: |
          uv sync --dev --extra ${{ matrix.executor }}
          uv run nuitka --assume-yes-for-downloads main.py
      - run: pkg/macos/build.sh ${{ matrix.binary }}
      - name: Install the package and load an instance with it
        run: |
          sudo installer -pkg dist/*.pkg -target /
          dscl . -read /Users/_bcc UniqueID
          sudo pkg/smoke-test.sh ${{ matrix.binary }}
          sudo /usr/local/share/*/uninstall.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-macos-arm64
          path: dist/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes "See CHANGELOG.md."
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
