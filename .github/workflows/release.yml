name: Release
# Builds the debs for amd64 and pkgs for macOS arm64 of bcc (quantify) and bcc.simulator
# (qiskit), each on that platform since Nuitka cannot cross-compile, smoke-tests them, and
# attaches them to the GitHub release of a v* tag. Run by hand, it leaves them as the run's
# artifacts instead. The rpm packaging in pkg/ is kept but not built.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the installers, e.g. 2026.09.0"
        required: true

env:
  # the Python the binaries are built and tested with; uv would otherwise take the newest it
  # can download, whose wheels may not exist yet
  UV_PYTHON: "3.13"
  # uv's own build of it, as Nuitka refuses e.g. Homebrew's on the macOS runners
  UV_MANAGED_PYTHON: "1"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
      # the release's notes are the tag's CHANGELOG.md section; read here, a tag without one
      # fails before the builds rather than after
      - id: notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "notes<<END_OF_NOTES"
            awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { is_found = 1; next }
              is_found && /^## \[/ { exit }
              is_found { print }
              END { if (!is_found) exit 1 }' CHANGELOG.md
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # its glibc 2.39 is the oldest the binaries then run on: Debian 13 and Ubuntu 24.04 onwards
    runs-on: ubuntu-24.04
    # qiskit, jax and scipy make a build of an hour or more
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - { binary: bcc, executor: quantify }
          - { binary: bcc.simulator, executor: qiskit }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: amd64
      EXECUTOR: ${{ matrix.executor }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      # the runner's apt lists can be out of date, for these and the deb's dependencies alike
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache patchelf
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-${{ matrix.executor }}-${{ github.sha }}
          restore-keys: nuitka-linux-${{ matrix.executor }}-
      - run: pkg/build.sh
      # also after a failed or timed-out build, so that the next one picks up where it stopped
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-${{ matrix.executor }}-${{ github.sha }}
      - run: pkg/package.sh ${{ matrix.binary }} deb
      - name: Install the package and load an instance with it
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ./dist/*.deb
          sudo pkg/smoke-test.sh ${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-linux-amd64
          path: dist/*

  macos:
    needs: version
    runs-on: macos-14
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - { binary: bcc, executor: quantify }
          - { binary: bcc.simulator, executor: qiskit }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      EXECUTOR: ${{ matrix.executor }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      # Nuitka's own download of ccache is Intel-only, and its clang then fails under Rosetta
      - run: brew install ccache
      - uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-macos-${{ matrix.executor }}-${{ github.sha }}
          restore-keys: nuitka-macos-${{ matrix.executor }}-
      - run: pkg/build.sh
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-macos-${{ matrix.executor }}-${{ github.sha }}
      - run: pkg/macos/build.sh ${{ matrix.binary }}
      - name: Install the package and load an instance with it
        run: |
          sudo installer -pkg dist/*.pkg -target /
          dscl . -read /Users/_bcc UniqueID
          sudo pkg/smoke-test.sh ${{ matrix.binary }}
          sudo /usr/local/share/*/uninstall.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-macos-arm64
          path: dist/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          # a release candidate must not become the repository's latest release
          IS_PRERELEASE: ${{ contains(github.ref_name, '-rc') }}
          NOTES: ${{ needs.version.outputs.notes }}
        # given the files, gh uploads them to a draft and then publishes it, as a published
        # release is immutable and takes no more
        run: >-
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag
          --prerelease="$IS_PRERELEASE" --notes "$NOTES"
