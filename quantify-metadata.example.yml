# This configuration file is needed to provide metadata for the instruments/Clusters that are needed for instrument coordinator setup
# This allows to copy external QBLOX cluster configuration file without additional changes, while still providing Cluster data in structured format

# instrument name
cluster0:
  # instrument type
  # Cluster or SPI-Rack
  instrument_type: Cluster

  # Ip address of the cluster
  ip_address: 192.168.78.101

  # whether to attempt connecting to the real cluster or to return dummy result for test purposes
  is_dummy: true

  # Delay in seconds to wait before each experiment execution within a single job.
  # Applies to every experiment in the job, including the first one.
  # Use this to enforce a minimum cooldown interval between back-to-back hardware executions.
  # Default is 0 (no delay).
  experiment_delay: 10

  # this would only be used to set up dummy cluster modules, those of quantify-config.json:
  # the qubits' drive lines, then the couplers' flux lines, then the readout of all three
  modules:
    "7":
      instrument_type: QCM_RF
    "8":
      instrument_type: QCM_RF
    "9":
      instrument_type: QCM_RF
    "11":
      instrument_type: QCM_RF
    "12":
      instrument_type: QCM_RF
    "17":
      instrument_type: QRM_RF

# instrument name
spi_rack0:
  # another allowed top-level type
  instrument_type: SPI-Rack
  # on Posix port looks like this
  port: "/dev/ttyACM0"
  # true, as the cluster's, until the device's real SPI rack is on the port
  is_dummy: true
  parking_current: 1e-4

  coupler_spi_mapping:
    u0:
      spi_module_number: 1
      dac_name: "dac0"

    u1:
      spi_module_number: 1
      dac_name: "dac1"