# backend_config.toml
[general_config]
name = "loke"
is_active = true
characterized = true
open_pulse = true
simulator = false
version = "1.0.0"
online_date = "2024-10-09T00:00:00"
num_qubits = 5
num_couplers = 0
num_resonators = 5
dt = 1e-9
dtm = 1e-9

[device_config]
discriminators = [ "lda" ]
qubit_ids = [ "q6", "q7", "q8", "q9", "q10"]
meas_map = [ [ 0 ], [ 1 ] ]
coordinates = [
  [0, 0],
  [1, 0]
]
fixed_duration_couplers = [ "q6_q7" ]
reverse_phase_qubits = [ "q9" ]

qubit_parameters = [
  "id",
  "x_position",
  "y_position",
  "xy_drive_line",
  "z_drive_line",
  "frequency",
  "pi_pulse_amplitude",
  "pi_pulse_duration",
  "pulse_type",
  "pulse_sigma",
  "t1_decoherence",
  "t2_decoherence"
]
resonator_parameters = [
  "id",
  "x_position",
  "y_position",
  "readout_line",
  "acq_delay",
  "acq_integration_time",
  "frequency",
  "pulse_delay",
  "pulse_duration",
  "pulse_type",
  "pulse_amplitude"
]

coupler_parameters = [
  "id",
  "frequency",
  "frequency_detuning",
  "anharmonicity",
  "coupling_strength_02",
  "coupling_strength_12",
  "cz_pulse_amplitude",
  "cz_pulse_dc_bias",
  "cz_pulse_phase_offset",
  "cz_pulse_duration_before",
  "cz_pulse_duration_rise",
  "cz_pulse_duration_constant",
  "control_rz_lambda",
  "target_rz_lambda",
  "pulse_type"
]

[device_config.discriminator_parameters]
lda = [
  "coef_0",
  "coef_1",
  "intercept"
]

[device_config.coupling_dict]
# map of coupler channel to qubit pair
u0 = ["q12", "q13"]
u1 = ["q12", "q14"]
u2 = ["q14", "q15"]
u3 = ["q12", "q15"]

[gates.x]
coupling_map = [ [ 0, 1], [1, 0] ]
qasm_def = "gate x q { U(pi, 0, pi) q; }"
parameters = [ ]

# Makes this a simulated device, which runs its jobs on QuTiP, from its calibration seed,
# rather than on Qblox clusters: each qubit's IQ points of states 0 and 1, by its id, and the
# readout noise about them. See docs/configuration.md.
#
# [simulator]
# readout_noise = 0.1
#
# [simulator.readout_iq]
# q12 = [[1.0, 0.0], [-1.0, 0.0]]
# q13 = [[0.0, 1.0], [0.0, -1.0]]

