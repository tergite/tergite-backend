# backend_config.toml
# A device of three transmons in a row, q12, q13 and q14, coupled by u0, between q12 and q13,
# and u1, between q13 and q14, on the Qblox cluster cluster0; the other example configs,
# calibration.seed.example.toml, quantify-config.example.json, quantify-metadata.example.yml
# and tergite-tuner's calib_device_config.example.toml, node_config.example.toml and
# spi_config.example.toml, describe the same device. bcc-provision names it after the instance.
[general_config]
name = "loke"
is_active = true
characterized = true
open_pulse = true
simulator = false
version = "1.0.0"
online_date = "2024-10-09T00:00:00"
num_qubits = 3
num_couplers = 2
num_resonators = 3
dt = 1e-9
dtm = 1e-9

[device_config]
discriminators = [ "lda" ]
qubit_ids = [ "q12", "q13", "q14" ]
# the qubits measured together, by their indices in qubit_ids
meas_map = [ [ 0, 1, 2 ] ]
coordinates = [ [ 0, 0 ], [ 1, 0 ], [ 2, 0 ] ]
# the couplers whose CZ duration a recalibration keeps, by the qubits they couple
fixed_duration_couplers = [ "q12_q13" ]
# the qubits that have their phases reversed on couplers
reverse_phase_qubits = [ "q14" ]

qubit_parameters = [
  "id",
  "x_position",
  "y_position",
  "xy_drive_line",
  "z_drive_line",
  "frequency",
  "pi_pulse_amplitude",
  "pi_pulse_duration",
  "pulse_type",
  "pulse_sigma",
  "t1_decoherence",
  "t2_decoherence"
]
resonator_parameters = [
  "id",
  "x_position",
  "y_position",
  "readout_line",
  "acq_delay",
  "acq_integration_time",
  "frequency",
  "pulse_delay",
  "pulse_duration",
  "pulse_type",
  "pulse_amplitude"
]

coupler_parameters = [
  "id",
  "frequency",
  "frequency_detuning",
  "anharmonicity",
  "coupling_strength_02",
  "coupling_strength_12",
  "cz_pulse_amplitude",
  "cz_pulse_dc_bias",
  "cz_pulse_phase_offset",
  "cz_pulse_duration_before",
  "cz_pulse_duration_rise",
  "cz_pulse_duration_constant",
  "control_rz_lambda",
  "target_rz_lambda",
  "pulse_type"
]

[device_config.discriminator_parameters]
lda = [
  "coef_0",
  "coef_1",
  "intercept"
]

[device_config.coupling_dict]
# map of coupler channel to qubit pair
u0 = ["q12", "q13"]
u1 = ["q13", "q14"]

[gates.x]
coupling_map = [ [ 0, 1], [1, 0] ]
qasm_def = "gate x q { U(pi, 0, pi) q; }"
parameters = [ ]

# Makes this a simulated device, a chip of these true parameters behind its dummy clusters,
# which the calibration does not see; tests/fixtures/backend_config.simq2.toml has a whole one.
# See docs/configuration.md.
#
# [simulator.chip]
# readout_noise = 0.002
#
# [simulator.chip.qubits.q12]
# frequency = 4.5116e9
# anharmonicity = -0.21e9
# rabi_frequency = 1.62e8
# t1 = 6e-5
# t2 = 5e-5
#
# [simulator.chip.resonators.q12]
# frequency = 7.2601e9
# dispersive_shift = -0.5e6
# bare_frequency = 7.2581e9
# critical_amplitude = 0.4
# internal_quality = 60000
# coupling_quality = 20000

# What the device's pulse-level jobs may play: OpenPulse cal blocks and defcals, from the
# projects MSS lets send them. Without this section the device refuses them all, so set
# it only with limits chosen for this chip, its fridge and its amplifiers; the values
# below are placeholders, from no chip. See docs/configuration.md.
#
# The limits by kind take a kind of frame each: drive, readout or coupler. A kind left out
# of max_amplitude, max_energy_per_shot or max_energy_per_job may not be played at all;
# here coupler frames are left out, as for a chip whose couplers are parked by hand.
#
# [pulse_limits]
# # the largest |sample| of a waveform on a frame of the kind, as a fraction of full scale
# max_amplitude = { drive = 0.5, readout = 0.3 }
# # Hz a frame may move from its calibrated frequency, by set_frequency or shift_frequency
# max_frequency_offset = 20e6
# # the energy on one frame in one shot, the sum of its samples' |amplitude|^2 times dt, in
# # full scale^2 s: e.g. a constant 0.3 for 100 ns is 0.3^2 * 100e-9 = 9e-9
# max_energy_per_shot = { drive = 1e-8, readout = 1e-7 }
# # the energy on one frame over the whole job: each circuit's per-shot energy times shots
# max_energy_per_job = { drive = 1e-4, readout = 1e-3 }
# # s of a circuit's pulse-level blocks in one shot, each block as long as its longest frame
# max_pulse_duration = 50e-6
# # the samples of one waveform, as played: a 1 us waveform at a dt of 1 ns is 1000
# max_samples_per_waveform = 16384
# # s of one capture
# max_capture_duration = 16e-6
