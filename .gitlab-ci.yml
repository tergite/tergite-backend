stages:
  - tests
  - package
  - release

variables:
  # pinned with its checksum, so that what packages a release is checked against this file
  NFPM_VERSION: "2.48.0"
  NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
  PYTHON_VERSION: "3.13"
  FF_NETWORK_PER_BUILD: 1

.setup_venv: &setup_venv
  image: python:${PYTHON_VERSION}
  before_script:
    - apt-get update
    # install dependencies for recalibration
    - apt-get install libgl1 -y
    # install uv
    - pip install uv
    # Ensure uv uses the project-local venv for easier sourcing
    - export UV_PROJECT_ENVIRONMENT="$CI_PROJECT_DIR/.venv"

tests:
  stage: tests
  <<: *setup_venv
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  script:
    # Install project dependencies
    - uv sync --dev
    - source .venv/bin/activate
    # Check formatting
    - ruff format --check
    - ruff check
    # Run unit tests
    - pytest tests -n 4 --dist=worksteal -m "not real_time"
    - pytest tests -m real_time
  cache:
    key: "uv-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/uv
      - .venv

# On a v* tag, as .github/workflows/release.yml does on GitHub: the deb for amd64 and the macOS
# installer of bcc, each built on its platform, as the Python they ship and some wheels are the
# platform's, uploaded to this project's package registry and linked from the release.
.package: &package
  stage: package
  needs: []
  timeout: 1h
  variables: &package_variables
    # the Python the packages ship; uv would otherwise take the newest it can download
    UV_PYTHON: "3.13"
  artifacts:
    paths:
      - published/
    expire_in: 1 year
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# built, installed and smoke-tested on Debian 13, the oldest Debian the package supports
package linux:
  <<: *package
  image: debian:trixie
  variables:
    <<: *package_variables
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  cache:
    key: "uv-cache-package-linux"
    paths:
      - .cache/uv
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    - pkg/build-linux.sh
    - curl -fsSL -o /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
    - echo "$NFPM_SHA256  /tmp/nfpm.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
    - pkg/render.sh >/dev/null
    - mkdir -p dist
    - ARCH=amd64 nfpm package -f build/pkg-bcc/nfpm.yaml -p deb -t dist/
    # build-linux.sh skips apt where the image has curl, so the deb's dependencies need fresh lists
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ./dist/*.deb
    - pkg/smoke-test.sh
    - pkg/publish.sh dist/*.deb

# A Mac with uv, registered with the shell executor and tagged macos, whose home folder keeps
# uv's cache between builds; only where PUBLISH_MACOS_ARM64 is
# exactly true, so that a pipeline without such a runner does not wait on it. SIGN_IDENTITY,
# set in the CI/CD variables, signs the installers. Not smoke-tested, as provisioning an
# instance needs the root a shell runner lacks.
package macos:
  <<: *package
  tags: [macos]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $PUBLISH_MACOS_ARM64 == "true"
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    - pkg/build.sh
    - pkg/macos/build.sh
    - pkg/publish.sh dist/*.pkg

release:
  stage: release
  image: alpine:3.20
  needs:
    - job: package linux
    - job: package macos
      optional: true
  script:
    - apk add --no-cache bash curl jq
    - pkg/release.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
