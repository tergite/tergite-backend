repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.13
        # only run on the project's own Python files
        files: ^(api|libs|services|utils|tests|dev|migrations)/.*\.py$|^(main|settings)\.py$

  - repo: https://github.com/pycqa/isort
    rev: 6.0.0
    hooks:
      - id: isort
        name: isort (python)
