# tergite-tuner's device config of the simulated devices, backend_config.simq1.toml and simq2: the
# rough guesses, as from a VNA, that it calibrates the chip from, each within its sweep of
# the chip's true value but not at it

[device]
name = "simulated chip"
owner = "tests"

[device.resonator.all]
attenuation = 10

[device.resonator]
q12 = { VNA_frequency = 7.2595e9 }
q13 = { VNA_frequency = 7.2009e9 }

[device.qubit.all]
attenuation = 12
measure.acq_delay = 220e-9
measure_1.acq_delay = 220e-9
measure_2.acq_delay = 220e-9
measure.pulse_duration = 2.5e-6
measure_1.pulse_duration = 2.5e-6
measure_2.pulse_duration = 2.5e-6
measure.integration_time = 2.5e-6
measure_1.integration_time = 2.5e-6
measure_2.integration_time = 2.5e-6
measure.pulse_amp = 0.08
measure_1.pulse_amp = 0.08
measure_2.pulse_amp = 0.08
rxy.duration = 28e-9
measure_3state_opt.pulse_duration = 3e-6
measure_3state_opt.acq_delay = 220e-9
measure_3state_opt.integration_time = 2.5e-6
reset.duration = 450e-6

[device.qubit.q12]
VNA_f01_frequency = 4.5125e9
VNA_f12_frequency = 4.3004e9

[device.qubit.q13]
VNA_f01_frequency = 5.1991e9
VNA_f12_frequency = 5.0016e9

[device.coupler.all]
attenuation = 30
cz_pulse_amplitude = 0.5
cz_pulse_width = 4e-9

[device.coupler.q12_q13]
parking_current = 0
# the chip's CZ swaps |11> with |02>, q13 going to |2>: the control's |2> via 20
control_qubit = "q13"
target_qubit = "q12"
cz_phase_path = "via_20"
cz_pulse_frequency = 489.6e6
cz_pulse_duration = 300e-9
cz_half_duration = 150e-9
