[build-system]
requires = ["setuptools>=69", "wheel","setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tergite-backend"
authors = [
    {name = "Miroslav Dobsicek"},
    {name = "Axel Andersson"},
    {name = "Adilet Tuleouv"},
    {name = "Martin Ahindura"},
    {name = "Stefan Hill"},
    {name = "David Wahlstedt"},
    {name = "Abdullah-Al Amin"},
    {name = "Pontus Vikstål"},
    {name = "Nicklas Botö"},
    {name = "Fabian Forslund"},
]
maintainers = [
    {name = "Chalmers Next Labs AB", email = "contact@quantum.chalmersnextlabs.se"}
]
version = "v2026.11.0-rc.9"
description = "the Backend of the Tergite software stack of the WACQT Quantum Computer."
readme = "README.md"
requires-python = ">=3.13,<3.14"
keywords = ["quantum", "quantify", "qutip"]
license = {file = "LICENSE.txt"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "sqlmodel~=0.0.24",
    "pyjwt~=2.9.0",
    "pyyaml~=6.0.2",
    "fastapi[standard]~=0.116.1",
    "toml>=0.10.2",
    "tabulate>=0.9.0",
    "cryptography~=45.0.2",
    "filelock~=3.18.0",
    "pydantic~=2.11.3",
    "websockets~=16.0",
    "uvicorn~=0.46.0",
    "starlette~=0.48.0",
    "pandas~=2.3.3",
    "pydantic-settings~=2.16.2",
    "python-dotenv~=1.2.2",
    "alembic~=1.16",
    # parses gate-level jobs' OpenQASM 3, and the OpenPulse it may hold
    "openpulse>=1.0.1",
    "quantify-core>=0.8.1",
    "quantify-scheduler~=0.22.2",
    "qblox-instruments~=0.14.2",
    "tergite-tuner>=2026.10.0rc6,<2026.11.0",
    "numpy>=2.0",
    # Fixing networkx to the last usable one; can be changed when code is updated
    "networkx~=3.4.2",
    "h5py>=3.14.0",
    "xarray",
    # the simulators' master equation
    "qutip>=5.3,<6",
    # the simulators keep BLAS to one thread
    "threadpoolctl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    # formats, sorts the imports and finds what pyflakes did
    "ruff==0.15.1",
    "time-machine~=3.5.1",
    "pytest-lazy-fixtures>=1.1.2",
    "pre-commit~=4.2.0",
    "pytest-mock~=3.14.1",
    "pytest-timeout~=2.3.1",
    "pytest-xdist~=3.8.0",
    # deps of deps
    # -----------
    # Adding these here to constrain their versions to
    # avoid resolution-too-deep errors
    "click~=8.1.8",
    "setuptools~=80.9.0"
]

[project.scripts]
bcc = "main:main"

[project.urls]
Homepage = "https://github.com/tergite/tergite-backend"
Repository = "https://github.com/tergite/tergite-backend"
Documentation = "https://github.com/tergite/tergite-backend/tree/main/docs"
Issues = "https://github.com/tergite/tergite-backend/issues"
Changelog = "https://github.com/tergite/tergite-backend/blob/main/CHANGELOG.md"

[tool.setuptools]
# the bcc command's, beside the packages
py-modules = ["main", "settings"]

[tool.setuptools.packages.find]
where = ["."]
# migrations has no __init__.py, which Alembic loads by path
include = ["api*", "libs*", "services*", "utils*", "migrations*"]
exclude = ["tests*", "build*", "dist*", "*.egg-info", ".venv*", "venv*"]

[tool.setuptools_scm]
# optional tweaks:
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# pyflakes' findings and isort's order, as black, isort and pyflakes checked before
select = ["F", "I"]

[tool.ruff.lint.isort]
# the top-level packages' names are generic, so ruff cannot tell them from third parties'
known-first-party = ["api", "libs", "services", "utils", "migrations", "main", "settings", "tests", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_level = "ERROR"
timeout = 120
timeout_method = "thread"
markers = [
  "real_time: its outcome depends on how fast the machine works through the jobs against bookings, so it runs alone, not beside other workers",
]
filterwarnings = [
  "ignore:This package has reached its end of life\\.:DeprecationWarning:quantify_scheduler\\..*",
  # NetworkX edges= kwarg change (message starts with \n so .*edges=.* won't match)
  "ignore::FutureWarning:networkx\\..*",
  # Starlette .env file not found (expected in tests)
  "ignore:Config file.*not found\\..*:UserWarning:starlette\\..*",
  # QCoDeS third-party deprecation
  "ignore:.*Call get directly on the parameter.*:DeprecationWarning:qblox_instruments\\..*",
  # Pydantic v2 class-based config
  "ignore:.*Support for class-based `config`.*:DeprecationWarning:pydantic\\..*",
  # SQLModel autoflush session warning
  "ignore:.*Object of type.*not in session.*:sqlalchemy.exc.SAWarning",
]
